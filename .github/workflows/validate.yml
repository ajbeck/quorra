name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run-tests: ${{ steps.classify.outputs.run-tests }}

    steps:
      - name: Decide whether application tests are required
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            echo 'run-tests=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_tests=false
          file_count=0

          while IFS= read -r path; do
            ((file_count += 1))

            case "$path" in
              .release-please-manifest.json | \
              CHANGELOG.md | \
              version.txt | \
              Packages/QuorraCore/Sources/QuorraCLIKit/QuorraVersion.swift)
                ;;
              *)
                run_tests=true
                ;;
            esac
          done < <(gh api \
            --paginate \
            "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename')

          if (( file_count == 0 )); then
            echo '::error::The pull request file list was empty.'
            exit 1
          fi

          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"

  pull-request-title:
    name: Release-compatible PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Release-compatible pull request title: $PR_TITLE"
            exit 0
          fi

          echo 'Pull request titles become squash commit titles and must use Conventional Commit syntax.'
          echo 'Examples: fix: prevent navigation flicker, feat(imds): add endpoint controls'
          exit 1

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.run-tests == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test
            runner: macos-26
            artifact: stable
          - name: Build and test (Xcode 27 preview)
            runner: xcode-27
            artifact: xcode-27

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "derived_data_path=$RUNNER_TEMP/quorra-derived-data" >> "$GITHUB_OUTPUT"
          echo "package_cache_path=$RUNNER_TEMP/quorra-package-cache" >> "$GITHUB_OUTPUT"
          echo "source_packages_path=$RUNNER_TEMP/quorra-source-packages" >> "$GITHUB_OUTPUT"
          echo "version=$(xcodebuild -version | awk '/^Xcode / { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore Swift package repository cache
        id: swift-package-repository-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.xcode.outputs.package_cache_path }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-package-repositories-v1-${{ hashFiles('Quorra.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/QuorraCore/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-package-repositories-v1-

      - name: Restore validation build cache
        id: validation-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.xcode.outputs.derived_data_path }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-derived-data-${{ hashFiles('Quorra.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Quorra.xcodeproj/project.pbxproj', 'Packages/QuorraCore/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-derived-data-

      - name: Build and test
        env:
          DERIVED_DATA_PATH: ${{ steps.xcode.outputs.derived_data_path }}
          PACKAGE_CACHE_PATH: ${{ steps.xcode.outputs.package_cache_path }}
          SOURCE_PACKAGES_PATH: ${{ steps.xcode.outputs.source_packages_path }}
        run: >-
          xcodebuild test
          -workspace Quorra.xcworkspace
          -scheme QuorraApp
          -testPlan quorra
          -destination 'platform=macOS'
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"
          -derivedDataPath "$DERIVED_DATA_PATH"
          -packageCachePath "$PACKAGE_CACHE_PATH"
          -disableAutomaticPackageResolution
          -skipPackagePluginValidation
          -showBuildTimingSummary
          -resultBundlePath "$RUNNER_TEMP/quorra-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Report Swift package storage
        if: ${{ always() }}
        env:
          PACKAGE_CACHE_PATH: ${{ steps.xcode.outputs.package_cache_path }}
          SOURCE_PACKAGES_PATH: ${{ steps.xcode.outputs.source_packages_path }}
        run: |
          du -sh "$PACKAGE_CACHE_PATH" "$SOURCE_PACKAGES_PATH" 2>/dev/null || true
          du -sh "$PACKAGE_CACHE_PATH"/* "$SOURCE_PACKAGES_PATH"/* 2>/dev/null | sort -h || true

      - name: Save Swift package repository cache
        if: >-
          ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-package-repository-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.xcode.outputs.package_cache_path }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-package-repositories-v1-${{ hashFiles('Quorra.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/QuorraCore/Package.swift') }}

      - name: Save validation build cache
        if: >-
          ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.validation-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.xcode.outputs.derived_data_path }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-quorra-derived-data-${{ hashFiles('Quorra.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Quorra.xcodeproj/project.pbxproj', 'Packages/QuorraCore/Package.swift') }}

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: quorra-test-results-${{ matrix.artifact }}
          path: ${{ runner.temp }}/quorra-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
