{{- /* Takes a page collection and renders it as a card list. */ -}}
{{- with . }}
<ul class="index-cards">
  {{- range . }}
  <li>
    <a class="index-card" href="{{ .RelPermalink }}">
      <span class="index-card__title">{{ .Title }}</span>
      {{ with .Description }}<span class="index-card__desc">{{ . }}</span>{{ end }}
    </a>
  </li>
  {{- end }}
</ul>
{{- end }}
